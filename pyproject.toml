[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus"
version = "0.1.0"
description = "Lightweight Robot Control Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mike"}
]
keywords = ["robotics", "ros2", "navigation", "lidar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "docker>=6.0.0",
]

[project.optional-dependencies]
neato = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
nimbus = "nimbus.cli.app:app"

[project.urls]
Homepage = "https://github.com/mike/nimbus"

[tool.setuptools.packages.find]
where = ["."]
include = ["nimbus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["nimbus/tests"]
markers = [
    "regression: marks tests as regression tests",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
